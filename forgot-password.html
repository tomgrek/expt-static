<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Assistance | PhysBox Pro</title>
  <link rel="stylesheet" href="styles.css?v=20260905">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-card-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #f4f6fa 60%, #eef1f6 100%);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-card-container">
    <div class="auth-card">
      <h2 style="font-family:'Outfit', sans-serif; font-size:1.75rem; margin-bottom:1rem; color:var(--text-primary);">
        <i class="fa-solid fa-key" style="color: var(--primary);"></i> Password-Free Authentication
      </h2>
      <p style="color:var(--text-secondary); line-height:1.65; margin-bottom:2rem; font-size:0.98rem;">
        PhysBox Pro utilizes <strong>Google Identity Services (OAuth 2.0)</strong>. You do not need a password to access PhysBox! Simply log in securely with your Google account.
      </p>
      <a href="login.html" class="btn btn-primary" style="display:inline-flex; padding:0.85rem 1.75rem; text-decoration:none;">
        <i class="fa-brands fa-google"></i> Sign In with Google
      </a>
    </div>
  </div>
</body>
</html>
