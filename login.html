<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | PhysBox Pro</title>
  <link rel="stylesheet" href="styles.css?v=20260905">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-card-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 20%, #ffffff 0%, #f4f6fa 60%, #eef1f6 100%);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-xl);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .auth-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .auth-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .google-btn-wrapper {
      display: flex;
      justify-content: center;
      margin: 1.5rem 0;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin: 1.5rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .early-access-box {
      background: var(--primary-light);
      border: 1px dashed rgba(79, 70, 229, 0.3);
      border-radius: 12px;
      padding: 1rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
    .early-access-box strong {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="auth-card-container">
    <div class="auth-card">
      <a href="index.html" class="auth-logo" style="text-decoration: none;">
        <i class="fa-solid fa-cube" style="color: var(--primary);"></i> PhysBox Pro
      </a>
      <p class="auth-subtitle">Single sign-in for Volt, Mesh, Etch &amp; Flux</p>

      <div class="google-btn-wrapper">
        <div id="google-signin-button"></div>
      </div>

      <p id="auth-error" role="alert" style="display:none; color:#b91c1c; background:#fef2f2; border:1px solid rgba(185,28,28,0.2); border-radius:10px; padding:0.7rem 0.9rem; font-size:0.86rem; margin-bottom:1rem;"></p>

      <div class="divider">Early Access Sign Up</div>

      <form id="early-access-form" onsubmit="handleEarlyAccessForm(event)">
        <input type="email" id="email-input" placeholder="Enter your email address" required style="width:100%; padding:0.8rem 1rem; border-radius:8px; border:1px solid var(--border-color); background:#f8fafc; color:var(--text-primary); margin-bottom:0.75rem; font-family:var(--font-body); font-size:0.92rem; outline:none;">
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.8rem; font-size:0.95rem;">
          Sign Up For Early Access
        </button>
      </form>

      <div class="early-access-box">
        <strong>Notice:</strong> PhysBox Pro requires an active subscription or Early Access invitation. Google Sign-In automatically registers your account for early access. <a href="pro.html" style="color: var(--primary); font-weight: 600;">See what Pro includes</a>.
      </div>
    </div>
  </div>

  <script src="auth.js?v=20260905"></script>
  <script>
    // Where to land after a successful sign-in. `?next=` lets gated pages —
    // download.html in particular — bounce through here and come back.
    const NEXT_PARAM = new URLSearchParams(window.location.search).get('next');
    // Only same-site relative paths, so a crafted link can't turn our own
    // sign-in into an open redirect to someone else's domain.
    const NEXT = NEXT_PARAM && /^[a-z0-9._-]+\.html(\?[^#]*)?(#.*)?$/i.test(NEXT_PARAM) ? NEXT_PARAM : null;

    const errorBox = document.getElementById('auth-error');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    function clearError() {
      errorBox.style.display = 'none';
    }

    function landAfterSignIn(data) {
      if (NEXT) {
        window.location.href = NEXT;
      } else if (data.is_admin || (data.user && data.user.subscription_tier === 'active')) {
        window.location.href = 'index.html?auth=success';
      } else {
        window.location.href = `guest-list.html?email=${encodeURIComponent(data.user.email)}`;
      }
    }

    // Already signed in? Skip straight through rather than making the user
    // click Google again.
    PhysBoxAuth.fetchCurrentUser().then(user => {
      if (user) landAfterSignIn({ user, is_admin: false });
    });

    PhysBoxAuth.renderGoogleSignInButton(
      document.getElementById('google-signin-button'),
      async (credential) => {
        clearError();
        try {
          const data = await PhysBoxAuth.loginWithGoogle(credential);
          landAfterSignIn(data);
        } catch (err) {
          showError(err.message || 'Sign-in failed. Please try again.');
        }
      },
      showError
    );

    async function handleEarlyAccessForm(e) {
      e.preventDefault();
      clearError();
      const email = document.getElementById('email-input').value;
      try {
        const res = await fetch(`${PhysBoxAuth.getApiBaseUrl()}/api/auth/early-access`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        if (!res.ok) {
          // Surface what the API actually said. A generic string here hides
          // real causes — a request that never reached the API at all reads
          // identically to a rejected email address.
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Could not add you to the list (HTTP ${res.status}).`);
        }
        localStorage.setItem('physbox_user_email', email);
        window.location.href = `guest-list.html?email=${encodeURIComponent(email)}`;
      } catch (err) {
        showError(err.message || 'Could not add you to the list. Please try again.');
      }
    }
  </script>
</body>
</html>
